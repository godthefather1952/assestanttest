name: Validate private local image app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript module syntax
        run: node --input-type=module --check < app.js

      - name: Verify privacy-first SDXS app
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s app-sdxs-20261007-v2.js
          test -s README.md
          test -s LICENSE
          grep -q "SunCanvas" index.html
          grep -q "SDXS" index.html
          grep -q "No API key" README.md
          grep -q "text_encoder_int8.onnx" app.js
          grep -q "unet_int8.onnx" app.js
          grep -q "@huggingface/tokenizers@0.2.0" app.js
          grep -q "tokenizer/tokenizer.json" app.js
          grep -q "tokenizer/tokenizer_config.json" app.js
          grep -q "app-sdxs-20261007-v2.js" index.html
          ! grep -Rni "@huggingface/transformers" app-sdxs-20261007-v2.js
          ! grep -Rni "pollinations" index.html app.js styles.css README.md
          ! grep -Rni "sd-turbo-ort-web" app.js
          ! grep -Rni "AutoTokenizer" app.js
          ! grep -Rni "@huggingface/transformers" app.js
          ! grep -Rni "localStorage" app.js
          ! grep -Rni "web-txt2img" app.js
          ! grep -Rni "esm.sh" app.js
