name: Validate static image app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s README.md
          test -s LICENSE
          grep -q "SunCanvas" index.html
          grep -q "Pollinations" README.md
