<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#151515" />
  <title>Assestant Browser</title>
  <style>
    :root{color-scheme:dark;--bg:#101010;--panel:#181818;--line:#303030;--text:#f3f3f3;--muted:#a8a8a8;--accent:#f3f3f3}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{overflow:hidden}
    .app{height:100dvh;display:flex;flex-direction:column}
    .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
    .row{display:flex;align-items:center;gap:7px;max-width:1400px;margin:0 auto}
    button,.url{height:40px;border:1px solid var(--line);border-radius:10px;background:#222;color:var(--text)}
    button{min-width:40px;padding:0 12px;font-size:16px;cursor:pointer}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.35;cursor:default}
    .url{flex:1;min-width:0;padding:0 13px;font-size:15px;outline:none}
    .url:focus{border-color:#666}
    .go{font-weight:700;background:var(--accent);color:#111;border-color:var(--accent)}
    .open{white-space:nowrap}
    .status{max-width:1400px;margin:6px auto 0;font-size:12px;color:var(--muted);min-height:16px;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .viewport{position:relative;flex:1;min-height:0;background:#fff}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;max-width:min(92%,720px);background:rgba(20,20,20,.92);color:#ddd;border:1px solid #444;border-radius:10px;padding:8px 12px;font-size:12px;text-align:center;display:none}
    @media(max-width:720px){
      .topbar{padding-left:7px;padding-right:7px}
      .row{gap:5px}
      button{min-width:38px;padding:0 9px}
      .open span{display:none}
      .open::after{content:"↗"}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="row">
      <button id="backBtn" aria-label="Back" title="Back">←</button>
      <button id="forwardBtn" aria-label="Forward" title="Forward">→</button>
      <button id="reloadBtn" aria-label="Reload" title="Reload">↻</button>
      <button id="homeBtn" aria-label="Home" title="Assestant test">⌂</button>
      <input id="urlInput" class="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Address" />
      <button id="goBtn" class="go">Go</button>
      <button id="openBtn" class="open" title="Open the current address in a normal browser tab"><span>Open tab</span></button>
    </div>
    <div id="status" class="status">Home: Assestant Live Test</div>
  </header>

  <main class="viewport">
    <iframe id="browserFrame" title="Browser content" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="hint" class="hint">Some websites prevent other websites from displaying them inside an embedded browser. If this page stays blank or shows a refusal message, tap <b>Open tab</b>.</div>
  </main>
</div>

<script>
(() => {
  const HOME = new URL('assessment.html', window.location.href).href;
  const frame = document.getElementById('browserFrame');
  const input = document.getElementById('urlInput');
  const status = document.getElementById('status');
  const hint = document.getElementById('hint');
  const backBtn = document.getElementById('backBtn');
  const forwardBtn = document.getElementById('forwardBtn');

  const historyStack = [];
  let historyIndex = -1;
  let currentUrl = HOME;
  let hintTimer;

  function pretty(url){
    try{
      const u = new URL(url);
      if(u.href === HOME) return 'assestant://home';
      return u.href;
    }catch{return url}
  }

  function normalize(raw){
    const value = raw.trim();
    if(!value) return HOME;
    if(value === 'assestant://home' || value === 'home') return HOME;

    if(/^https?:\/\//i.test(value)) return value;
    if(/^file:/i.test(value) || /^javascript:/i.test(value) || /^data:/i.test(value)) {
      throw new Error('That address type is not allowed.');
    }
    if(value.includes('.') && !/\s/.test(value)) return 'https://' + value;
    return 'https://www.google.com/search?q=' + encodeURIComponent(value);
  }

  function updateButtons(){
    backBtn.disabled = historyIndex <= 0;
    forwardBtn.disabled = historyIndex >= historyStack.length - 1;
  }

  function load(url, push = true){
    currentUrl = url;
    input.value = pretty(url);
    status.textContent = url === HOME ? 'Home: Assestant Live Test' : 'Loading ' + url;
    frame.src = url;

    if(push){
      historyStack.splice(historyIndex + 1);
      historyStack.push(url);
      historyIndex = historyStack.length - 1;
    }
    updateButtons();

    clearTimeout(hintTimer);
    hint.style.display = 'none';
    if(url !== HOME){
      hintTimer = setTimeout(() => {
        hint.style.display = 'block';
        setTimeout(() => hint.style.display = 'none', 7000);
      }, 2200);
    }
  }

  function navigateFromInput(){
    try{
      load(normalize(input.value));
    }catch(err){
      status.textContent = err.message;
    }
  }

  frame.addEventListener('load', () => {
    status.textContent = currentUrl === HOME ? 'Home: Assestant Live Test' : 'Loaded: ' + currentUrl;
  });

  document.getElementById('goBtn').addEventListener('click', navigateFromInput);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){e.preventDefault();navigateFromInput();}
  });

  backBtn.addEventListener('click', () => {
    if(historyIndex > 0){
      historyIndex--;
      load(historyStack[historyIndex], false);
    }
  });

  forwardBtn.addEventListener('click', () => {
    if(historyIndex < historyStack.length - 1){
      historyIndex++;
      load(historyStack[historyIndex], false);
    }
  });

  document.getElementById('reloadBtn').addEventListener('click', () => {
    frame.src = 'about:blank';
    requestAnimationFrame(() => frame.src = currentUrl);
    status.textContent = 'Reloading ' + pretty(currentUrl);
  });

  document.getElementById('homeBtn').addEventListener('click', () => load(HOME));

  document.getElementById('openBtn').addEventListener('click', () => {
    const target = currentUrl === HOME ? HOME : currentUrl;
    window.open(target, '_blank', 'noopener,noreferrer');
  });

  const params = new URLSearchParams(location.search);
  const requested = params.get('url');
  if(requested){
    try{ load(normalize(requested)); }
    catch{ load(HOME); }
  }else{
    load(HOME);
  }
})();
</script>
</body>
</html>
