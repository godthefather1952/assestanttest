<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111318">
  <title>Sandbox Browser</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="browser">
    <header class="chrome">
      <div class="toolbar">
        <button class="icon-btn" id="backBtn" aria-label="Back" title="Back">←</button>
        <button class="icon-btn" id="forwardBtn" aria-label="Forward" title="Forward">→</button>
        <button class="icon-btn" id="reloadBtn" aria-label="Reload" title="Reload">↻</button>
        <button class="icon-btn home-btn" id="homeBtn" aria-label="Home" title="Home">⌂</button>
        <form id="navForm" class="omnibox" autocomplete="off">
          <span class="shield" aria-hidden="true">◇</span>
          <input id="address" aria-label="Address and search" inputmode="url" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address">
          <button class="go-btn" id="goBtn" type="submit">Go</button>
        </form>
      </div>
      <div class="subbar">
        <div class="privacy-pill"><span class="dot"></span> Isolated session</div>
        <div class="privacy-pill blocked">Downloads blocked</div>
        <div class="privacy-pill blocked">Private network blocked</div>
        <div class="page-title" id="pageTitle">Sandbox Browser</div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Remote browser viewport">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Starting isolated browser…</span>
      </div>
      <img id="screen" alt="Remote browser page" draggable="false">
      <div class="notice" id="notice" role="status"></div>
      <div class="keyboard-dock" id="keyboardDock">
        <input id="typeBox" autocomplete="off" autocapitalize="sentences" placeholder="Type into selected field">
        <button id="sendTextBtn">Type</button>
        <button id="backspaceBtn" class="dock-icon" aria-label="Backspace">⌫</button>
        <button id="enterBtn" class="dock-icon" aria-label="Enter">↵</button>
        <button id="closeKeyboardBtn" class="dock-icon" aria-label="Close keyboard">×</button>
      </div>
    </section>

    <footer class="statusbar">
      <span id="status">Connecting…</span>
      <button id="keyboardBtn" class="keyboard-btn">Keyboard</button>
      <button id="endSessionBtn" class="keyboard-btn danger-btn">End session</button>
      <button id="signOutBtn" class="keyboard-btn">Sign out</button>
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
